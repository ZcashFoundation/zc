name: zc Rust API check
description: Check a Rust workspace for breaking public API and dependency changes
author: Zcash Foundation

branding:
  icon: check-circle
  color: blue

inputs:
  baseline:
    description: Git ref used as the comparison baseline
    required: true
  head:
    description: Optional exact head ref; omit it to compare the baseline branch point with HEAD
    required: false
    default: ""
  working-directory:
    description: Directory containing the Rust workspace
    required: false
    default: .
  with-lock:
    description: Include transitive Cargo.lock changes
    required: false
    default: "false"
  with-values:
    description: Include public const, static value, and documentation changes
    required: false
    default: "false"
  with-changelog:
    description: Also write a Keep a Changelog draft, exposed as the changelog output
    required: false
    default: "false"
  fail-on:
    description: Findings that fail the step (breaking, api-breaking, error, or none)
    required: false
    default: breaking

outputs:
  verdict:
    description: ok, breaking, or error
    value: ${{ steps.check.outputs.verdict }}
  report:
    description: Absolute path of the JSON report file
    value: ${{ steps.check.outputs.report }}
  changelog:
    description: Absolute path of the Keep a Changelog markdown file, empty unless with-changelog drafted one
    value: ${{ steps.check.outputs.changelog }}

runs:
  using: composite
  steps:
    - name: Build zc
      shell: bash
      run: cargo install --path "$GITHUB_ACTION_PATH" --locked --root "$RUNNER_TEMP/zc-bin"

    - name: Install the Rust nightly used by zc
      shell: bash
      env:
        ZC_TOOLCHAIN: nightly-2026-07-18
      run: rustup toolchain install "$ZC_TOOLCHAIN" --profile minimal --no-self-update

    - name: Install cargo-public-api
      uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
      with:
        tool: cargo-public-api@0.52.0
        checksum: true
      env:
        RUSTUP_TOOLCHAIN: nightly-2026-07-18

    - name: Check the public API and dependencies
      id: check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_HEAD: ${{ inputs.head }}
        INPUT_WITH_LOCK: ${{ inputs.with-lock }}
        INPUT_WITH_VALUES: ${{ inputs.with-values }}
        INPUT_WITH_CHANGELOG: ${{ inputs.with-changelog }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        RUSTUP_TOOLCHAIN: nightly-2026-07-18
        ZC_TOOLCHAIN: nightly-2026-07-18
      run: |
        set -euo pipefail

        arguments=()

        case "$INPUT_WITH_LOCK" in
          true) arguments+=(--with-lock) ;;
          false) ;;
          *)
            echo "::error title=Invalid with-lock input::Expected true or false."
            exit 64
            ;;
        esac

        case "$INPUT_WITH_VALUES" in
          true) arguments+=(--with-values) ;;
          false) ;;
          *)
            echo "::error title=Invalid with-values input::Expected true or false."
            exit 64
            ;;
        esac

        case "$INPUT_FAIL_ON" in
          breaking | api-breaking | error | none) arguments+=(--fail-on "$INPUT_FAIL_ON") ;;
          *)
            echo "::error title=Invalid fail-on input::Expected breaking, api-breaking, error, or none."
            exit 64
            ;;
        esac

        report=$RUNNER_TEMP/zc-report.json
        rm -f "$report"
        arguments+=(--report "$report")

        changelog=""
        case "$INPUT_WITH_CHANGELOG" in
          true)
            changelog=$RUNNER_TEMP/zc-changelog.md
            rm -f "$changelog"
            arguments+=(--changelog-file "$changelog")
            ;;
          false) ;;
          *)
            echo "::error title=Invalid with-changelog input::Expected true or false."
            exit 64
            ;;
        esac

        arguments+=("$INPUT_BASELINE")
        if [[ -n "$INPUT_HEAD" ]]; then
          arguments+=("$INPUT_HEAD")
        fi

        status=0
        "$RUNNER_TEMP/zc-bin/bin/zc" "${arguments[@]}" || status=$?

        verdict=""
        if [[ -f "$report" ]]; then
          verdict=$(jq -r '.verdict' "$report")
        fi
        # An analysis error leaves no changelog behind, so the output must not name one.
        [[ -f "$changelog" ]] || changelog=""
        {
          echo "verdict=$verdict"
          echo "report=$report"
          echo "changelog=$changelog"
        } >>"$GITHUB_OUTPUT"

        exit "$status"
