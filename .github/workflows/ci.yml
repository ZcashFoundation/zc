name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
          annotations: true

  # cargo-deny reads live advisory data, so it can start failing without any change to this
  # repository. As its own job it never hides the results of the build and test jobs.
  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-deny
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny@0.20.2
          checksum: true
      - name: Check advisories, licenses, bans, and sources
        run: cargo deny --locked check

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: unit tests
        run: cargo test --locked --all-features
      - name: shellcheck
        run: shellcheck -S warning tests/run.sh
      - name: bash syntax
        run: bash -n tests/run.sh

  msrv:
    name: MSRV build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the declared MSRV toolchain
        run: rustup toolchain install 1.85 --profile minimal --no-self-update
      - name: check
        run: cargo +1.85 check --locked --all-features --all-targets

  test:
    name: integration tests
    runs-on: ubuntu-latest
    env:
      ZC_TOOLCHAIN: nightly-2026-10-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create an action fixture
        id: fixture
        run: |
          mkdir -p action-fixture/src
          cd action-fixture
          printf '[package]\nname = "zc_action_fixture"\nversion = "0.1.0"\nedition = "2021"\n' > Cargo.toml
          printf 'version = 4\n\n[[package]]\nname = "zc_action_fixture"\nversion = "0.1.0"\n' > Cargo.lock
          git init
          git config user.name "zc CI"
          git config user.email "zc-ci@users.noreply.github.com"
          printf 'pub fn existing() {}\n' > src/lib.rs
          git add .
          git commit -m "fixture baseline"
          echo "baseline=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'pub fn existing() {}\npub fn added() {}\n' > src/lib.rs
          git add src/lib.rs
          git commit -m "fixture head"
      - name: Run the local action
        # The `$/` self-repository form zizmor suggests is not yet understood by actionlint.
        uses: ./ # zizmor: ignore[self-repository]
        with:
          baseline: ${{ steps.fixture.outputs.baseline }}
          working-directory: action-fixture
      - name: Build zc
        run: cargo build --release --locked
      - name: Run integration tests
        env:
          ZC: ${{ github.workspace }}/target/release/zc
        run: tests/run.sh
